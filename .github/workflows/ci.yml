name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (includes schema conformance and migration tests)
        run: cargo test --locked
      - name: Validate shared protocol examples with the CLI
        run: cargo run --locked -q -p cwb-cli -- validate ../schemas/protocol/examples/valid/*.json

  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/ImuLogger
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Format
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Test
        run: swift test
