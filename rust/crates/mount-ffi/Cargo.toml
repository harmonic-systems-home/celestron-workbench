[package]
name = "cwb-mount-ffi"
description = "A C interface to a mount session (the Celestron adapter and the encoder-only controller) for Mac apps (ADR 0019)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# A static library for the Swift apps; an rlib for the Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
cwb-celestron-discovery.workspace = true
cwb-celestron-setup.workspace = true
jiff.workspace = true
cwb-mount-celestron.workspace = true
cwb-mount-core.workspace = true
cwb-mount-sim.workspace = true
serde.workspace = true
serde_json.workspace = true

# The one crate allowed `unsafe`: the C boundary in lib.rs, and nothing else.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile.workspace = true
