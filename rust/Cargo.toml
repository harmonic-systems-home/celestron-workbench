[workspace]
resolver = "3"
members = ["crates/protocol", "crates/storage", "crates/receiver", "crates/analysis", "crates/mount-core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/harmonic-systems-home/celestron-workbench"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
jsonschema = { version = "0.60.2", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

cwb-protocol = { path = "crates/protocol" }
cwb-storage = { path = "crates/storage" }
cwb-receiver = { path = "crates/receiver" }
cwb-analysis = { path = "crates/analysis" }
cwb-mount-core = { path = "crates/mount-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
